# Posts the day's roster opportunities: at most one per sport per day (the code enforces this, so
# running several times a day is safe; later runs just say "already posted today").
#
# Why several times: GitHub often starts scheduled runs late and sometimes skips one, so three tries
# make sure the post goes out. It has its own concurrency group, so it never waits behind the long
# nightly research run in "Daily roster intel".
# Times are UTC: 16:05 = 9:05 AM Pacific (daylight time), 19:12 = 12:12 PM, 22:17 = 3:17 PM.
name: Daily posts
on:
  schedule:
    - cron: "5 16 * * *"
    - cron: "12 19 * * *"   # backup, only posts if the first run didn't
    - cron: "17 22 * * *"   # backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roster-intel-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Each value accepts either name: the one in the docs, or the shorter name used in this repo's secrets.
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATA_BASE_URI }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT }}
      TELEGRAM_BASEBALL_CHANNEL_ID: ${{ secrets.TELEGRAM_BASEBALL_CHANNEL_ID || secrets.TELEGRAM_BASEBALL }}
      TELEGRAM_SOFTBALL_CHANNEL_ID: ${{ secrets.TELEGRAM_SOFTBALL_CHANNEL_ID || secrets.TELEGRAM_SOFTBALL }}
      TELEGRAM_FOOTBALL_CHANNEL_ID: ${{ secrets.TELEGRAM_FOOTBALL_CHANNEL_ID || secrets.TELEGRAM_FOOTBALL }}
      # one basketball group and one soccer group serve both the men's and women's feeds
      TELEGRAM_MBB_CHANNEL_ID: ${{ secrets.TELEGRAM_MBB_CHANNEL_ID || secrets.TELEGRAM_BASKETBALL }}
      TELEGRAM_WBB_CHANNEL_ID: ${{ secrets.TELEGRAM_WBB_CHANNEL_ID || secrets.TELEGRAM_BASKETBALL }}
      TELEGRAM_MSOC_CHANNEL_ID: ${{ secrets.TELEGRAM_MSOC_CHANNEL_ID || secrets.TELEGRAM_SOCCER }}
      TELEGRAM_WSOC_CHANNEL_ID: ${{ secrets.TELEGRAM_WSOC_CHANNEL_ID || secrets.TELEGRAM_SOCCER }}
      # optional private review chat (Approve / Reject buttons)
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_JOIN_LINKS: ${{ vars.TELEGRAM_JOIN_LINKS }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
      # Owner's choice (2026-09-28): no manual approval step. Items that pass the approval rules (guardrails,
      # not LOW confidence) approve themselves; one per sport goes out per day, the rest wait in the queue.
      # Set the repository variable AUTO_APPROVE=false to go back to approving by hand.
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
      # Owner's choice: post a random qualifying opportunity each day (PICK_MODE=best posts the top-ranked one)
      PICK_MODE: ${{ vars.PICK_MODE || 'random' }}
      # Each night: research the 250 programs checked longest ago, 8 schools' sites at a time (each site polite)
      RESEARCH_BATCH: ${{ vars.RESEARCH_BATCH || '250' }}
      RESEARCH_WORKERS: ${{ vars.RESEARCH_WORKERS || '8' }}
      # LIVE (owner turned this on 2026-09-28): posts really go to the Telegram groups.
      # To pause posting without deleting anything, add the repository variable DRY_RUN=true.
      TEST_MODE: ${{ vars.TEST_MODE || 'false' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'America/Los_Angeles' }}
      ADMIN_PASSWORD: unused-in-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL (or DATA_BASE_URI) secret (Supabase connection string) first."; exit 1
          fi
      # Button presses in the admin chat are collected here when no webhook is set
      # (set the repository variable TELEGRAM_USE_WEBHOOK=true if you registered one).
      - name: Collect Approve / Reject presses from Telegram
        if: env.TELEGRAM_ADMIN_CHAT_ID != '' && vars.TELEGRAM_USE_WEBHOOK != 'true'
        run: python -m app.cli telegram-poll
      - name: Publish today's posts (max one per sport)
        run: python -m app.cli publish-daily --sport all
