name: Tests
on:
  push:
    branches-ignore: ["captured/**"]  # captured pages only, no code
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roster_intel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest
      - name: Tests on Postgres
        run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roster_intel_test
