name: DB cleanup (archive old roster/stats copies, keep newest)
# Archive already saved as release db-archive-2026-11-07 (183,844,859 bytes) before any delete.
# Deletes run in small committed batches: one big transaction dropped the connection on the free instance.
on: workflow_dispatch
permissions:
  contents: read
concurrency: db-cleanup
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATA_BASE_URI }}
      GH_TOKEN: ${{ github.token }}
      PGOPTIONS: "-c statement_timeout=0 -c default_transaction_read_only=off"
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Archive must exist
        run: gh release view db-archive-2026-11-07 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].size' | grep -q 183844859
      - name: Keep lists
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE;
          SET default_transaction_read_only = off;
          SHOW default_transaction_read_only;
          DROP TABLE IF EXISTS cleanup_keep_snap, cleanup_keep_stat;
          CREATE TABLE cleanup_keep_snap AS SELECT max(id) AS id FROM roster_snapshots WHERE player_count > 0 GROUP BY team_id;
          CREATE UNIQUE INDEX ON cleanup_keep_snap(id);
          CREATE TABLE cleanup_keep_stat AS SELECT team_id, max(collected_at) - interval '3 hours' AS since FROM player_stats GROUP BY team_id;
          CREATE UNIQUE INDEX ON cleanup_keep_stat(team_id);
          SELECT (SELECT count(*) FROM cleanup_keep_snap) teams_roster, (SELECT count(*) FROM cleanup_keep_stat) teams_stats;
          SQL
      - name: Delete old roster entries in batches
        run: |
          read lo hi < <(psql "$DATABASE_URL" -X -At -F' ' -c "select min(id), max(id) from roster_entries")
          for ((a=lo; a<=hi; a+=50000)); do
            for try in 1 2 3; do
              psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -c "SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE; SET default_transaction_read_only = off; SET statement_timeout = 0;" -c "DELETE FROM roster_entries r WHERE r.id >= $a AND r.id < $((a+50000)) AND NOT EXISTS (SELECT 1 FROM cleanup_keep_snap k WHERE k.id = r.snapshot_id)" && break
              sleep 10
            done
          done
          psql "$DATABASE_URL" -X -c "select count(*) roster_rows_left from roster_entries"
      - name: Delete old stats in batches
        run: |
          read lo hi < <(psql "$DATABASE_URL" -X -At -F' ' -c "select min(id), max(id) from player_stats")
          for ((a=lo; a<=hi; a+=25000)); do
            for try in 1 2 3; do
              psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -c "SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE; SET default_transaction_read_only = off; SET statement_timeout = 0;" -c "DELETE FROM player_stats p USING cleanup_keep_stat k WHERE p.id >= $a AND p.id < $((a+25000)) AND p.team_id = k.team_id AND p.collected_at < k.since" && break
              sleep 10
            done
          done
          psql "$DATABASE_URL" -X -c "select count(*) stats_rows_left, count(distinct team_id) teams from player_stats"
      - name: Reclaim disk
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE; SET default_transaction_read_only = off; SET statement_timeout = 0;" -c "VACUUM FULL ANALYZE roster_entries;"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE; SET default_transaction_read_only = off; SET statement_timeout = 0;" -c "VACUUM FULL ANALYZE player_stats;"
          psql "$DATABASE_URL" -X -c "SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE; SET default_transaction_read_only = off; SET statement_timeout = 0;" -c "DROP TABLE IF EXISTS cleanup_keep_snap, cleanup_keep_stat;"
      - name: Size after
        run: |
          psql "$DATABASE_URL" -X -c "select pg_size_pretty(pg_database_size(current_database())) after;"
          psql "$DATABASE_URL" -X -c "select relname, pg_size_pretty(pg_total_relation_size(oid)) from pg_class where relname in ('player_stats','roster_entries','players','sources') order by pg_total_relation_size(oid) desc;"
