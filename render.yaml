# Optional: hosts the admin dashboard on Render (render.com → New → Blueprint → pick this repo).
# The daily jobs run in GitHub Actions; this is only the approve/edit screen.
services:
  - type: web
    name: tam-roster-intel-admin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BASEBALL_CHANNEL_ID
        sync: false
      - key: TELEGRAM_JOIN_LINKS
        sync: false
      - key: TEST_MODE
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: APP_TIMEZONE
        value: America/Los_Angeles
