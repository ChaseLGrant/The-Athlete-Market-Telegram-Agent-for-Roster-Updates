# Optional: hosts the admin dashboard on Render (render.com → New → Blueprint → pick this repo).
# The daily jobs run in GitHub Actions; this is only the approve/edit screen.
services:
  - type: web
    name: tam-roster-intel-admin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BASEBALL_CHANNEL_ID
        sync: false
      - key: TELEGRAM_SOFTBALL_CHANNEL_ID
        sync: false
      - key: TELEGRAM_FOOTBALL_CHANNEL_ID
        sync: false
      - key: TELEGRAM_MBB_CHANNEL_ID
        sync: false
      - key: TELEGRAM_WBB_CHANNEL_ID
        sync: false
      - key: TELEGRAM_MSOC_CHANNEL_ID
        sync: false
      - key: TELEGRAM_WSOC_CHANNEL_ID
        sync: false
      - key: TELEGRAM_JOIN_LINKS
        sync: false
      # private review chat with Approve / Reject buttons (optional)
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # your dashboard's https address (Render shows it at the top of the service page)
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TEST_MODE
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: APP_TIMEZONE
        value: America/Los_Angeles
